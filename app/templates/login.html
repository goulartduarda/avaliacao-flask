{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title text-center mb-4"><i class="bi bi-box-arrow-in-right"></i> Login</h4>
        <form method="post">
          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Digite seu e-mail" required>
          </div>
          <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>
            <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite sua senha" required>
          </div>
          <button type="submit" class="btn btn-primary w-100"><i class="bi bi-door-open-fill"></i> Entrar</button>
        </form>
        <div class="mt-3 text-center">
          <a href="/register" class="text-decoration-none">Não tem conta? Cadastre-se</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
