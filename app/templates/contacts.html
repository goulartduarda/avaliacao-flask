{% extends 'base.html' %}
{% block title %}Contatos{% endblock %}
{% block content %}
<h2>Contatos</h2>
<form method="post" action="/contacts/add">
    <input name="nome" placeholder="Nome" class="form-control mb-2" required>
    <input name="email" placeholder="Email" class="form-control mb-2" required>
    <input name="celular" placeholder="Celular" class="form-control mb-2" required>
    <button class="btn btn-primary" type="submit">Adicionar Contato</button>
</form>
<hr>
<ul class="list-group mt-3">
    {% for c in contatos %}
    <li class="list-group-item">{{ c.nome }} - {{ c.email }} - {{ c.celular }}</li>
    {% endfor %}
</ul>
<a href="/messages" class="btn btn-link mt-3">Ir para Mensagens</a>
<a href="/logout" class="btn btn-secondary">Logout</a>
{% endblock %}
