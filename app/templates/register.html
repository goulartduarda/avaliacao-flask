{% extends 'base.html' %}
{% block title %}Cadastro{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title text-center mb-4"><i class="bi bi-person-plus-fill"></i> Cadastro</h4>
        <form method="post">
          <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control" id="nome" name="nome" placeholder="Seu nome completo" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Digite seu e-mail" required>
          </div>
          <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>
            <input type="password" class="form-control" id="senha" name="senha" placeholder="Crie uma senha" required>
          </div>
          <button type="submit" class="btn btn-success w-100"><i class="bi bi-person-check-fill"></i> Cadastrar</button>
        </form>
        <div class="mt-3 text-center">
          <a href="/login" class="text-decoration-none">Já tem conta? Faça login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
